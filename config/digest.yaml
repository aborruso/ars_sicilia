prompt: |
  Crea un digest delle trascrizioni di sedute dell'Assemblea Regionale per aiutare i cittadini a comprendere i principali punti discussi. L'obiettivo è produrre un riassunto chiaro e sintetico che favorisca la cittadinanza attiva rendendo accessibili i lavori parlamentari regionali.

  IMPORTANTE: Tutto l'output deve essere in italiano.

  Ecco la trascrizione da analizzare:

  <transcript>
  $input
  </transcript>

  Analizza questa trascrizione e produci tre output chiave:

  1. **DIGEST**: Un riassunto chiaro e sintetico dei punti principali della seduta. Scrivi in linguaggio accessibile per il pubblico generale, evidenziando decisioni chiave, dibattiti, proposte ed esiti. Concentrati su ciò che è più rilevante per i cittadini.
     - Struttura cronologica degli eventi
     - Evidenzia i nodi politici e le tensioni
     - Includi gli esiti delle votazioni con numeri precisi (se presenti)
     - Spiega i termini tecnici quando necessario

     FORMATTAZIONE MARKDOWN (rispetta rigorosamente):
     - Usa `##` o `###` SOLO come titolo di sezione, all'inizio della riga, seguiti da uno spazio. MAI in mezzo a una frase per enfatizzare parole.
     - Per enfatizzare parole o concetti nel testo usa il grassetto `**parola**`, mai i cancelletti.
     - Separa titoli e paragrafi con una riga vuota. Inserisci veri ritorni a capo, MAI la sequenza letterale `\n`.
     - Non mescolare grassetto e titolo sulla stessa riga (es. NON scrivere `**## Titolo**`).

  2. **CATEGORIE**: Assegna da 1 a 5 categorie che definiscono contesto e tematiche della seduta. Scegli ESCLUSIVAMENTE dal seguente vocabolario controllato, copiando le etichette ESATTAMENTE come scritte (non inventare categorie nuove, non modificare le etichette). Le descrizioni ti aiutano a scegliere la categoria giusta.

     [INIZIO ELENCO CATEGORIE]
     - Procedure parlamentari: Lavori d'aula e funzionamento dell'Assemblea: ordine dei lavori, mozioni, interrogazioni, emendamenti, votazioni procedurali, nomine, regolamento interno, rapporti Governo-Assemblea.
     - Bilancio e finanze: Bilancio regionale, leggi di stabilità, variazioni di bilancio, debito, tributi, spesa pubblica, programmazione economico-finanziaria.
     - Enti locali e autonomie: Comuni, province e città metropolitane, finanza locale, autonomia speciale siciliana, rapporti Stato-Regione.
     - Politiche sociali: Welfare, famiglia, povertà, disabilità, terzo settore, politiche giovanili, assistenza sociale.
     - Ambiente e territorio: Tutela dell'ambiente, rifiuti, servizio idrico, dissesto idrogeologico, aree protette, sostenibilità, benessere animale.
     - Lavoro: Occupazione, precariato, vertenze, sicurezza sul lavoro, politiche attive del lavoro, personale in formazione.
     - Sviluppo economico: Imprese e attività produttive, industria, commercio, artigianato, competitività, credito, zone economiche speciali.
     - Giustizia e legalità: Contenzioso, antimafia, anticorruzione, trasparenza, etica pubblica, criminalità organizzata.
     - Infrastrutture e trasporti: Strade, ferrovie, porti, aeroporti, trasporto pubblico locale, mobilità, opere pubbliche, ponte sullo Stretto.
     - Sanità: Servizio sanitario regionale, ospedali e ASP, liste d'attesa, salute pubblica, salute mentale, personale sanitario.
     - Istruzione e formazione: Scuola, università, diritto allo studio, edilizia scolastica, formazione professionale, ricerca.
     - Agricoltura e pesca: Agricoltura, agroalimentare, zootecnia, pesca, forestazione, consorzi di bonifica, crisi idrica in agricoltura.
     - Turismo: Promozione turistica, strutture ricettive, grandi eventi a vocazione turistica.
     - Cultura e sport: Beni culturali, patrimonio archeologico, spettacolo, editoria e informazione, identità siciliana, memoria storica, sport.
     - Energia: Energie rinnovabili, efficientamento energetico, reti e impianti, costi dell'energia.
     - Protezione civile: Emergenze, calamità naturali, incendi, ricostruzione post-disastro, soccorso civile.
     - Sicurezza pubblica: Ordine pubblico, forze dell'ordine, videosorveglianza, sicurezza urbana.
     - Pubblica amministrazione e digitale: Organizzazione e personale della Regione, società partecipate, semplificazione, digitalizzazione, gestione del patrimonio pubblico.
     - Unione europea e relazioni internazionali: Fondi europei, PNRR, programmazione comunitaria, politica estera, cooperazione internazionale, pace.
     - Diritti e pari opportunità: Diritti civili e umani, parità di genere, pari opportunità, contrasto alle discriminazioni e alla violenza di genere.
     - Urbanistica ed edilizia: Pianificazione urbanistica, edilizia pubblica e privata, politiche abitative, assetto del territorio.
     - Elezioni e riforme istituzionali: Legge elettorale, elezioni, riforme dello Statuto e delle istituzioni regionali, forma di governo.
     [FINE ELENCO CATEGORIE]

  3. **PERSONE MENZIONATE**: Crea un elenco di tutte le persone citate nella trascrizione con i loro ruoli (es. Presidente della Regione, Assessore regionale, Deputato regionale, Sindaco, ecc.).
     - Includi il nome completo quando disponibile
     - Specifica il ruolo istituzionale
     - Per gli assessori, indica la delega se menzionata (es. "Assessore al Bilancio")
     - Per i deputati, indica il gruppo parlamentare se menzionato

  Prima di produrre l'output finale, usa lo scratchpad per organizzare i tuoi pensieri.

  <scratchpad>
  - Leggi la trascrizione e identifica gli argomenti principali
  - Annota decisioni chiave, proposte e dibattiti
  - Identifica temi ricorrenti e mappali su categorie appropriate
  - Elenca tutte le persone menzionate e determina i loro ruoli dal contesto
  - Pianifica come strutturare il digest per massima chiarezza e coinvolgimento cittadino
  - Nota eventuali votazioni e i loro esiti
  - Identifica tensioni politiche o procedurali significative
  </scratchpad>

  Ora fornisci la tua analisi nel seguente formato:

  <digest>
  Scrivi un riassunto chiaro e sintetico della seduta (circa 250-500 parole). Concentrati sui punti principali che i cittadini devono conoscere. Usa linguaggio accessibile e organizza le informazioni logicamente. Evidenzia decisioni chiave, dibattiti ed esiti.

  Struttura suggerita:
  - Contesto generale della seduta
  - Argomenti principali discussi
  - Dibattiti significativi e posizioni politiche
  - Decisioni prese ed esiti delle votazioni
  - Eventuali questioni procedurali o tensioni politiche rilevanti
  </digest>

  <categories>
  Elenca da 1 a 5 categorie, una per riga, scelte SOLO dal vocabolario controllato indicato sopra, con le etichette esatte.
  </categories>

  <people>
  Elenca ogni persona menzionata nella trascrizione con il suo ruolo, nel seguente formato:
  - [Nome Cognome]: [Ruolo/Titolo completo]

  Se il ruolo di una persona non è esplicitamente indicato, deducilo dal contesto o annotalo come "Ruolo non specificato" se poco chiaro.
  Ordina alfabeticamente per cognome.
  </people>

  RICORDA: Il tuo digest deve servire la cittadinanza attiva rendendo i lavori parlamentari regionali trasparenti e comprensibili al pubblico generale.